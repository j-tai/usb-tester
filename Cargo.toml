[package]
name = "usb-tester"
version = "0.1.0"
authors = ["Jasmine Tai <jtai@jtai.ca>"]
edition = "2024"

[[bin]]
name = "usb-tester"
harness = false

[profile.dev]
opt-level = "s"
debug = true

[profile.release]
opt-level = "s"
debug = true

[dependencies]
cortex-m = { version = "0.7.10", features = ["critical-section-single-core", "inline-asm"] }
cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["defmt", "exti", "memory-x", "stm32f030c8", "time-driver-any"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
